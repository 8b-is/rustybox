name: Rust

on: [push, pull_request]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the nightly + components; rustup honors it.
      - name: Toolchain
        run: |
          rustup show
          rustc --version --verbose
          cargo --version --verbose

      # Use the runner's cached interpreter without changing the action allowlist.
      - name: Set up cached Python 3.11
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import subprocess

          cache = Path(os.environ["RUNNER_TOOL_CACHE"]) / "Python"
          candidates = sorted(cache.glob("3.11.*/x64/bin/python3.11"))
          if not candidates:
              raise SystemExit("Runner cache has no Python 3.11 interpreter")
          interpreter = candidates[-1]
          library_path = str(interpreter.parent.parent / "lib")
          if os.environ.get("LD_LIBRARY_PATH"):
              library_path += ":" + os.environ["LD_LIBRARY_PATH"]
          os.environ["LD_LIBRARY_PATH"] = library_path
          subprocess.run([str(interpreter), "-c",
                          "import sys; assert sys.version_info[:2] == (3, 11)"],
                         check=True)
          environment = Path(os.environ["RUNNER_TEMP"]) / "rustybox-ci-python"
          subprocess.run([str(interpreter), "-m", "venv", str(environment)], check=True)
          with open(os.environ["GITHUB_PATH"], "a") as paths:
              paths.write(str(environment / "bin") + "\n")
          with open(os.environ["GITHUB_ENV"], "a") as variables:
              variables.write("LD_LIBRARY_PATH=" + library_path + "\n")
          PY

      - name: Xargs option regression tests
        run: |
          rustup toolchain install stable --profile minimal
          python -m unittest discover -s tests -p test_xargs_options.py -v

      - name: Code Review Graph Build
        run: |
          python -m pip install code-review-graph
          code-review-graph build


      # Whole tree must compile (features only gate the applet dispatch table,
      # not module compilation). NOTE: 2000+ warnings are inherited from the
      # c2rust transpile and are cleaned up incrementally, so no -D warnings yet.
      - name: Build (all applets)
        run: cargo build --all-features

      - name: Build (curated core)
        run: >
          cargo build --release --no-default-features
          --features "cat ls echo cp mv rm mkdir rmdir ln pwd touch true false
          head tail wc sort uniq grep sed cut tr chmod chown df du ps kill sleep
          env printenv date basename dirname readlink stat which id whoami ash"

      - name: Smoke test
        run: |
          BIN=target/debug/rustybox
          test "$($BIN echo hi)" = "hi"
          $BIN true  && echo "true ok"
          $BIN false || echo "false ok"
          printf 'a\nb\nc\n' | $BIN wc -l
          printf 'b\na\nb\n' | $BIN sort | $BIN uniq

      - name: Modern backend tests
        run: cargo test --no-default-features --features "modern" --test modern

      - name: Build MIT edition (rustybox-core)
        run: cargo build -p rustybox-core

  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: rustfmt (advisory)
        # Transpiled code is not fully rustfmt-clean yet; report but don't fail.
        run: cargo fmt --all -- --check || true
